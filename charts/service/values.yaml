# Defaults for the library chart.
#
# What is NOT defaulted here is the point: probes, resources, the PDB decision
# and the NetworkPolicy allow list have no defaults, because a default is how a
# D-34 gate gets satisfied by accident instead of on purpose. _validate.tpl
# refuses to render without them.

nameOverride: ''

image:
  repository: ''
  tag: ''
  # A digest wins over a tag when both are set. CI passes a digest for
  # production; a tag is fine for a preview namespace.
  digest: ''

containerPort: 3000
command: []

env: {}
envFrom: []

service:
  enabled: true
  port: 80

# Only read when autoscaling.enabled is false.
replicaCount: null

autoscaling:
  enabled: false
  minReplicas: null
  maxReplicas: null
  targetCPUUtilizationPercentage: null
  targetMemoryUtilizationPercentage: null

rollout:
  maxSurge: 1
  maxUnavailable: 0

# ARCHITECTURE §11.1 asks for graceful shutdown that lets pg-boss finish or
# release in-flight jobs. 30s is the Kubernetes default and is too short for a
# worker draining a queue; the per-Deployment values override it upward.
terminationGracePeriodSeconds: 45

tmpSizeLimit: 64Mi

extraVolumes: []
extraVolumeMounts: []

# --- The four gates that need per-app values. No defaults, deliberately. ---
# probes:
#   readiness: { httpGet: { path: /health, port: http }, ... }
#   liveness:  { httpGet: { path: /health, port: http }, ... }
# resources:
#   requests: { cpu: 100m, memory: 256Mi }
#   limits:   { cpu: 500m, memory: 512Mi }
# podDisruptionBudget:
#   enabled: true
#   minAvailable: 1
# networkPolicy:
#   enabled: true
#   ingress: []
#   egress: []
